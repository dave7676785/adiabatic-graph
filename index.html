<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>גרף אדיאבטי אינטראקטיבי</title><style>body{font:20px Arial;background:#edf4fa;color:#142e48;margin:24px}h1{margin:0 0 14px}main{display:grid;grid-template-columns:1fr 2fr;gap:20px}section{background:white;padding:20px;border-radius:16px}label{display:block;margin:18px 0}input{width:100%;accent-color:#007e91}svg{width:100%;height:auto}output{font-weight:bold;color:#007e91}.result{font-size:30px;color:#007e91}small{font-size:16px} @media(max-width:800px){main{grid-template-columns:1fr}}</style><h1>תהליך אדיאבטי – גרף לחץ ונפח</h1><main><section><label>לחץ התחלתי (bar מוחלט): <output id="op"></output><input id="p" type="range" min="0.5" max="4" step="0.1" value="1"></label><label>נפח התחלתי (m³): <output id="ov"></output><input id="v" type="range" min="0.005" max="0.015" step="0.001" value="0.01"></label><label>מקדם אדיאבטי γ: <output id="og"></output><input id="g" type="range" min="1.2" max="1.67" step="0.01" value="1.4"></label><label>נפח סופי (m³): <output id="ow"></output><input id="w" type="range" min="0.002" max="0.02" step="0.001" value="0.005"></label><label><input style="width:auto" id="iso" type="checkbox" checked> הצג עקומה איזותרמית</label><button onclick="p.value=1;v.value=.01;g.value=1.4;w.value=.005;iso.checked=true;draw()">איפוס נתונים</button></section><section><svg id="chart" viewBox="0 0 780 470" direction="ltr" role="img" aria-label="גרף לחץ מול נפח"></svg><div><span style="color:#e65c19">━ אדיאבטי</span>　<span style="color:#236ac3">┄ איזותרמי</span>　<span style="color:#008775">● מצב סופי</span></div><p dir="ltr">P₂ = P₁ × (V₁ / V₂)<sup>γ</sup></p><p id="sub" dir="ltr"></p><div class="result" id="res"></div><p id="state"></p><small>P₁, P₂ – לחץ מוחלט ב־bar; V₁, V₂ – נפח במטר מעוקב; γ – יחס קיבולי החום, ללא יחידות. מודל גז אידיאלי בתהליך אדיאבטי הפיך עם γ קבוע; Q = 0 J.</small></section></main><script>const $=id=>document.getElementById(id);const p=$('p'),v=$('v'),g=$('g'),w=$('w'),iso=$('iso');function draw(){let a=+p.value,b=+v.value,c=+g.value,d=+w.value;const f=x=>a*(b/x)**c,h=x=>a*b/x;let r=f(d),mx=Math.max(f(.002),h(.002)),step=Math.pow(10,Math.floor(Math.log10(mx/5)));step*=Math.ceil(mx/5/step);let top=step*5;const X=x=>80+(x-.002)/.018*660,Y=y=>405-y/top*360;let s='';for(let i=0;i<=5;i++){let y=i*step;s+=`<path d="M80 ${Y(y)} H740" stroke="#dce5ed"/><text x="70" y="${Y(y)+5}" text-anchor="end" font-size="15">${+y.toFixed(2)}</text>`}for(let i=2;i<=20;i+=2){let x=X(i/1000);s+=`<path d="M${x} 45 V405" stroke="#dce5ed"/><text x="${x}" y="427" text-anchor="middle" font-size="14">${(i/1000).toFixed(3)}</text>`}s+='<path d="M80 45 V405 H740" stroke="#142e48" stroke-width="2" fill="none"/><text x="12" y="25" font-size="19">P (bar)</text><text x="410" y="457" text-anchor="middle" font-size="19">V (m³)</text>';function curve(fn,col,dash=''){return `<polyline points="${Array.from({length:361},(_,i)=>{let x=.002+i*.00005;return X(x)+','+Y(fn(x))}).join(' ')}" fill="none" stroke="${col}" stroke-width="4" stroke-dasharray="${dash}"/>`}s+=curve(f,'#e65c19');if(iso.checked)s+=curve(h,'#236ac3','8 6');s+=`<circle cx="${X(b)}" cy="${Y(a)}" r="6" fill="#142e48"/><path d="M${X(d)} ${Y(r)} V405" stroke="#008775" stroke-dasharray="5 4"/><circle cx="${X(d)}" cy="${Y(r)}" r="7" fill="#008775"/>`;$('chart').innerHTML=s; $('op').textContent=a.toFixed(1);$('ov').textContent=b.toFixed(3);$('og').textContent=c.toFixed(2);$('ow').textContent=d.toFixed(3);$('sub').textContent=`P₂ = ${a} × (${b.toFixed(3)} / ${d.toFixed(3)}) ^ ${c}`;$('res').textContent=`${r.toFixed(2)} bar`;$('state').textContent=d<b?'דחיסה אדיאבטית':d>b?'התפשטות אדיאבטית':'מצב התחלתי'}document.querySelectorAll('input').forEach(el=>el.addEventListener('input',draw));draw();</script></html>
