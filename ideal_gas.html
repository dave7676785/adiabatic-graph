<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחשבון גז אידיאלי</title><style>body{font:22px Arial;background:#edf5fb;color:#16334b;margin:0}main{max-width:1000px;margin:auto;padding:24px}section{background:white;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 14px #16334b18}h1{color:#075985}label{display:block;margin:12px 0}input,select{font:inherit;padding:8px;border:1px solid #93b3ca;border-radius:8px;max-width:100%}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:15px}input{width:145px}output{display:block;font-size:38px;color:#087f63;font-weight:bold}.eq{direction:ltr;text-align:center;font-size:30px;overflow-wrap:anywhere}small{font-size:16px}</style><main><h1>משוואת המצב של גז אידיאלי</h1><section class="eq">P · V = m · R · T</section><section><label>בחר את המשתנה לחישוב: <select id="target"><option value="P">לחץ P</option><option value="V">נפח V</option><option value="m">מסה m</option><option value="R">קבוע הגז R</option><option value="T">טמפרטורה T</option></select></label><label>סוג הגז: <select id="gas"><option value="287">אוויר</option><option value="296.8">חנקן</option><option value="259.8">חמצן</option><option value="188.9">פחמן דו-חמצני</option><option value="2077">הליום</option><option value="custom">ערך ידני</option></select></label><div class="fields"><div><label>לחץ מוחלט P</label><input id="P" type="number" min="0" step="any" value="1"><select id="pu"><option value="100000">bar</option><option value="1000">kPa</option><option value="1">Pa</option></select></div><div><label>נפח V</label><input id="V" type="number" min="0" step="any" value="10"><select id="vu"><option value="0.001">L</option><option value="1">m³</option></select></div><div><label>מסה m (kg)</label><input id="m" type="number" min="0" step="any" value="0.012"></div><div><label>קבוע הגז R — J/(kg·K)</label><input id="R" type="number" min="0" step="any" value="287"></div><div><label>טמפרטורה T (K)</label><input id="T" type="number" min="0" step="any" value="300"></div></div></section><section><h2>פתרון</h2><div id="formula" class="eq"></div><p>הצבה ביחידות SI:</p><div id="sub" class="eq"></div><p>תוצאה:</p><output id="result" dir="ltr"></output><small id="conversion"></small></section><p>החישוב מניח גז אידיאלי. יש להזין לחץ מוחלט וטמפרטורה בקלווין.</p></main><script>const $=id=>document.getElementById(id), keys=['P','V','m','R','T'];const fmt=x=>Number(x.toPrecision(8)).toString();function calc(){let t=$('target').value;keys.forEach(k=>{$(k).disabled=k===t});let a=Object.fromEntries(keys.map(k=>[k,Number($(k).value)]));a.P*=+$('pu').value;a.V*=+$('vu').value;let f={P:'m · R · T / V',V:'m · R · T / P',m:'P · V / (R · T)',R:'P · V / (m · T)',T:'P · V / (m · R)'}; $('formula').textContent=t+' = '+f[t];if(keys.some(k=>k!==t&&(!(a[k]>0)||!Number.isFinite(a[k])))){$('result').textContent='יש להזין ערכים חיוביים';$('sub').textContent='';$('conversion').textContent='';return}let {P,V,m,R,T}=a;let b={P:m*R*T/V,V:m*R*T/P,m:P*V/(R*T),R:P*V/(m*T),T:P*V/(m*R)}[t];$('sub').textContent=t+' = '+f[t].replace(/[PVmRT]/g,k=>fmt(a[k]));let factor=t==='P'?+$('pu').value:t==='V'?+$('vu').value:1;let unit=t==='P'?$('pu').selectedOptions[0].text:t==='V'?$('vu').selectedOptions[0].text:{m:'kg',R:'J/(kg·K)',T:'K'}[t];$('result').textContent=fmt(b/factor)+' '+unit;$('conversion').textContent=t==='P'?fmt(b)+' Pa = '+fmt(b/1000)+' kPa = '+fmt(b/100000)+' bar':t==='V'?fmt(b)+' m³ = '+fmt(b*1000)+' L':'';$(t).value=fmt(b/factor)}$('gas').addEventListener('change',()=>{if($('gas').value!=='custom')$('R').value=$('gas').value;calc()});$('R').addEventListener('input',()=>{$('gas').value='custom'});document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));calc();</script></html>
