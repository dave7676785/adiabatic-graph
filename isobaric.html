<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחשבון איזוברי</title><style>*{box-sizing:border-box}body{margin:0;background:#eef6f6;font:20px Arial;color:#18354b}main{max-width:1000px;margin:auto;padding:20px}header{background:#123b59;color:white;padding:22px;border-radius:18px;text-align:center}h1{margin:0}section{background:white;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 12px #123b5912}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.state{padding:18px;border-radius:12px;background:#d8f5ef}.state+ .state{background:#ffead5}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:10px;border:1px solid #a0b8c5;border-radius:8px;width:100%;background:white}input:disabled{background:#e5e8eb;color:#153d57}button{background:#123b59;color:white;cursor:pointer}#result{background:#087e79;color:white;text-align:center;font-size:32px;padding:20px;border-radius:12px}.eq{direction:ltr;text-align:center;font-size:25px;margin:12px;overflow-wrap:anywhere}svg{width:100%;height:auto} @media(max-width:550px){body{font-size:16px}.grid{gap:8px}.state{padding:10px}}</style><main><header><h1>תהליך איזוברי</h1><p>לחץ קבוע • חוק שארל</p><div class="eq">V₁ / T₁ = V₂ / T₂</div></header><section><div class="grid"><div><label for="target">משתנה לחישוב</label><select id="target"><option value="V2">V₂ – נפח סופי</option><option value="V1">V₁ – נפח התחלתי</option><option value="T1">T₁ – טמפרטורה התחלתית</option><option value="T2">T₂ – טמפרטורה סופית</option></select></div><div><label for="unit">יחידות נפח</label><select id="unit"><option value="L">ליטר (L)</option><option value="m³">מטר מעוקב (m³)</option></select></div></div><div class="grid"><div class="state"><h3>מצב התחלתי</h3><label for="V1">V₁ – נפח <span class="u"></span></label><input id="V1" type="number" step="any" value="10"><label for="T1">T₁ – טמפרטורה (K)</label><input id="T1" type="number" step="any" value="300"></div><div class="state"><h3>מצב סופי</h3><label for="V2">V₂ – נפח <span class="u"></span></label><input id="V2" type="number" step="any" value="20"><label for="T2">T₂ – טמפרטורה (K)</label><input id="T2" type="number" step="any" value="600"></div></div></section><section><b>1. נוסחה כללית</b><div class="eq" id="formula"></div><b>2. הצבת נתונים</b><div class="eq" id="sub"></div><b>3. פתרון</b><div class="eq" id="steps"></div><div id="result" aria-live="polite"></div></section><section><h2>גרף נפח מול טמפרטורה</h2><svg id="graph" viewBox="0 0 700 340" role="img" aria-label="גרף נפח מול טמפרטורה"></svg><p>🔵 מצב התחלתי　 🟠 מצב סופי</p><p>הקו מתאר יחס ישר בין הנפח לטמפרטורה בקלווין. ההמשך לראשית הוא אידיאליזציה מתמטית.</p></section><button id="reset">איפוס המחשבון</button></main><script>const $=id=>document.getElementById(id),keys=['V1','V2','T1','T2'],terms={V1:['V2','T1','T2'],V2:['V1','T2','T1'],T1:['V1','T2','V2'],T2:['V2','T1','V1']},fmt=n=>String(Number(n.toPrecision(8))),sym=k=>k[0]+(k[1]==1?'₁':'₂'); let oldUnit='L';function update(){let t=$('target').value,u=$('unit').value,[b,c,d]=terms[t],a=Object.fromEntries(keys.map(k=>[k,Number($(k).value)]));keys.forEach(k=>$(k).disabled=k===t);document.querySelectorAll('.u').forEach(e=>e.textContent='('+u+')');$('formula').textContent=`${sym(t)} = (${sym(b)} × ${sym(c)}) / ${sym(d)}`;let r=a[b]*a[c]/a[d];if(![b,c,d].every(k=>a[k]>0&&Number.isFinite(a[k]))||!Number.isFinite(r)||r<=0){$(t).value='';$('result').textContent='יש להזין ערכים חיוביים תקינים';$('sub').textContent='—';$('steps').textContent='—';$('graph').innerHTML='';return}a[t]=r;$(t).value=fmt(r);$('sub').textContent=`${sym(t)} = (${fmt(a[b])} × ${fmt(a[c])}) / ${fmt(a[d])}`;$('steps').textContent=`${sym(t)} = ${fmt(a[b]*a[c])} / ${fmt(a[d])}`;$('result').textContent=`${sym(t)} = ${fmt(r)} ${t[0]==='V'?u:'K'}`;let X=Math.max(a.T1,a.T2)*1.2,Y=Math.max(a.V1,a.V2)*1.2,s='';for(let i=0;i<=5;i++){let x=85+570*i/5,y=280-235*i/5;s+=`<path d="M85 ${y} H655 M${x} 45 V280" stroke="#dce6ea"/><text x="76" y="${y+4}" text-anchor="end" font-size="12">${fmt(Y*i/5)}</text><text x="${x}" y="300" text-anchor="middle" font-size="12">${fmt(X*i/5)}</text>`}s+=`<path d="M85 40 V280 H660" fill="none" stroke="#18354b" stroke-width="2"/><path d="M85 280 L655 45" stroke="#087e79" stroke-width="4"/><text x="85" y="25" font-size="16">V (${u})</text><text x="370" y="330" text-anchor="middle" font-size="16">T (K)</text>`;for(let i of [1,2])s+=`<circle cx="${85+570*a['T'+i]/X}" cy="${280-235*a['V'+i]/Y}" r="8" fill="${i===1?'#2563eb':'#ea580c'}" stroke="white" stroke-width="2"/>`;$('graph').innerHTML=s}keys.forEach(k=>$(k).addEventListener('input',update));$('target').onchange=update;$('unit').onchange=()=>{let u=$('unit').value;for(let k of ['V1','V2'])if($(k).value!=='')$(k).value=fmt(Number($(k).value)*(u==='L'?1000:.001));oldUnit=u;update()};$('reset').onclick=()=>{$('target').value='V2';$('unit').value='L';oldUnit='L';['10','20','300','600'].forEach((v,i)=>$(keys[i]).value=v);update()};update();</script></html>
