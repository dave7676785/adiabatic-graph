<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחשבון איזותרמי</title><style>*{box-sizing:border-box}body{font:18px Arial;background:#eef2ff;color:#172554;margin:0}main{max-width:1000px;margin:auto;padding:22px}header{background:#312e81;color:white;padding:25px;border-radius:18px;text-align:center}h1{margin:0 0 12px}section{background:white;padding:20px;border-radius:16px;margin-top:16px;box-shadow:0 4px 18px #25306012}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.state{padding:18px;border-radius:14px;background:#dbeafe}.state+ .state{background:#ffedd5}label{display:block;margin:12px 0 5px}input,select,button{font:inherit;padding:10px;border:1px solid #a5b4fc;border-radius:8px;max-width:100%}input{width:100%;direction:ltr}input:disabled{background:#d1fae5;color:#065f46;opacity:1}button{background:#4338ca;color:white;cursor:pointer}.eq{direction:ltr;text-align:center;font-size:23px;margin:12px 0}.result{color:#047857;font-size:28px;font-weight:bold;text-align:center}svg{width:100%;height:auto}small{color:#475569}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:10px}}</style><main><header><h1>חוק בויל–מריוט</h1>תהליך איזותרמי · טמפרטורה קבועה<div class="eq">P₁ × V₁ = P₂ × V₂</div></header><section><div class="grid"><div><label>משתנה לחישוב</label><select id="target"><option value="P2">P₂ – לחץ סופי</option><option value="P1">P₁ – לחץ התחלתי</option><option value="V1">V₁ – נפח התחלתי</option><option value="V2">V₂ – נפח סופי</option></select></div><div><label>יחידות לחץ מוחלט</label><select id="pu"><option>bar</option><option>kPa</option><option>Pa</option></select><label>יחידות נפח</label><select id="vu"><option>L</option><option>m³</option></select></div></div><div class="grid"><div class="state"><b>מצב התחלתי</b><label id="lP1"></label><input id="P1" type="number" step="any" value="1"><label id="lV1"></label><input id="V1" type="number" step="any" value="10"></div><div class="state"><b>מצב סופי</b><label id="lP2"></label><input id="P2" type="number" step="any" value="2"><label id="lV2"></label><input id="V2" type="number" step="any" value="5"></div></div><p><button id="reset">איפוס</button></p><small>כל הלחצים מוחלטים. יש להזין ערכים חיוביים. הטמפרטורה ומסת הגז קבועות.</small></section><section><b>שלבי החישוב</b><div id="steps"></div><div id="result" class="result"></div></section><section><b>גרף לחץ מול נפח</b><svg id="graph" viewBox="0 0 600 350" direction="ltr"></svg><p>🔵 מצב התחלתי &nbsp; 🟠 מצב סופי</p></section></main><script>const $=id=>document.getElementById(id),keys=['P1','V1','P2','V2'],terms={P1:['P2','V2','V1'],P2:['P1','V1','V2'],V1:['P2','V2','P1'],V2:['P1','V1','P2']},fmt=n=>Number(n.toPrecision(8)).toString(),sym=k=>k[0]+(k[1]==='1'?'₁':'₂');let pu='bar',vu='L';function update(){let t=$('target').value,[b,c,d]=terms[t],a={};for(let k of keys){$(k).disabled=k===t;a[k]=Number($(k).value);$('l'+k).textContent=(k[0]==='P'?'לחץ ':'נפח ')+sym(k)+' ('+(k[0]==='P'?pu:vu)+')'}let r=a[b]*a[c]/a[d];$('steps').innerHTML='<div>1. נוסחה כללית</div><div class="eq">'+sym(t)+' = ('+sym(b)+' × '+sym(c)+') / '+sym(d)+'</div>';if(![b,c,d].every(k=>a[k]>0&&Number.isFinite(a[k]))||!Number.isFinite(r)||r<=0){$(t).value='';$('result').textContent='יש להזין ערכים חיוביים תקינים';$('graph').innerHTML='';return}$(t).value=fmt(r);a[t]=r;$('steps').innerHTML+='<div>2. הצבת נתונים</div><div class="eq">'+sym(t)+' = ('+fmt(a[b])+' × '+fmt(a[c])+') / '+fmt(a[d])+'</div><div>3. פתרון</div><div class="eq">'+sym(t)+' = '+fmt(a[b]*a[c])+' / '+fmt(a[d])+'</div>';$('result').textContent=sym(t)+' = '+fmt(r)+' '+(t[0]==='P'?pu:vu);draw(a)}function draw(a){let xmax=Math.max(a.V1,a.V2)*1.25,ymax=Math.max(a.P1,a.P2)*1.25,xx=v=>80+480*v/xmax,yy=p=>290-250*p/ymax,C=a.P1*a.V1,s='';for(let i=0;i<=5;i++){let x=80+i*96,y=290-i*50;s+=`<path d="M80 ${y} H560 M${x} 40 V290" stroke="#cbd5e1"/><text x="72" y="${y+4}" text-anchor="end" font-size="12">${fmt(ymax*i/5)}</text><text x="${x}" y="310" text-anchor="middle" font-size="12">${fmt(xmax*i/5)}</text>`}s+='<path d="M80 35 V290 H565" fill="none" stroke="#172554" stroke-width="2"/>';let pts=[];for(let i=0;i<=200;i++){let v=C/ymax+(xmax-C/ymax)*i/200;pts.push(xx(v)+','+yy(C/v))}s+=`<polyline points="${pts.join(' ')}" stroke="#7c3aed" stroke-width="3" fill="none"/><text x="15" y="22">P (${pu})</text><text x="320" y="340">V (${vu})</text>`;for(let i of [1,2]){let x=xx(a['V'+i]),y=yy(a['P'+i]),color=i===1?'#2563eb':'#ea580c';s+=`<path d="M80 ${y} H${x} V290" stroke="${color}" stroke-dasharray="5 4" fill="none"/><circle cx="${x}" cy="${y}" r="6" fill="${color}"/>`}$('graph').innerHTML=s}for(let k of keys)$(k).oninput=update;$('target').onchange=update;const f={bar:100000,kPa:1000,Pa:1,L:.001,'m³':1};function units(prefix,old,next){for(let k of keys.filter(k=>k[0]===prefix))if($(k).value!=='')$(k).value=fmt(Number($(k).value)*f[old]/f[next])}$('pu').onchange=()=>{units('P',pu,$('pu').value);pu=$('pu').value;update()};$('vu').onchange=()=>{units('V',vu,$('vu').value);vu=$('vu').value;update()};$('reset').onclick=()=>{pu=$('pu').value='bar';vu=$('vu').value='L';$('target').value='P2';[1,10,2,5].forEach((v,i)=>$(keys[i]).value=v);update()};update();</script></html>
