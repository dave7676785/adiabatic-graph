<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>מחשבון אדיאבטי בליטרים</title><style>body{font:20px Arial;background:#eaf4ff;color:#17324d;margin:24px}main{max-width:1100px;margin:auto;background:white;padding:24px;border-radius:20px}h1{color:#075aab}svg{width:100%;max-height:450px}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}label{background:#eff6fc;padding:15px;border-radius:10px}input{width:100%;accent-color:#087dc4}#result{background:#dff7ec;padding:20px;border-radius:12px;text-align:center;font-size:25px}small{font-size:16px} </style><main><h1>תהליך אדיאבטי – לחץ מול נפח בליטרים</h1><p>אוויר כגז אידיאלי, תהליך הפיך, מקדם קבוע. הלחצים מוחלטים.</p><svg id="plot" viewBox="0 0 800 420" direction="ltr" role="img" aria-label="גרף לחץ בנפח"></svg><p style="text-align:center"><span style="color:#e56824">━ אדיאבטי</span> &nbsp; <span style="color:#087dc4">┄ איזותרמי</span></p><section id="controls"></section><p id="result" dir="ltr"></p><p dir="ltr" style="text-align:center">P₂ = P₁ × (V₁ / V₂)<sup>γ</sup></p><small> P₁, P₂ – לחץ מוחלט (bar); V₁, V₂ – נפח (L); γ – מקדם אדיאבטי ללא יחידות. Q = 0 בתהליך אדיאבטי (Q – חום מועבר, J).</small></main><script>const specs=[['p','לחץ התחלתי (bar)',1,4,.1,1],['a','נפח התחלתי (L)',5,15,.5,10],['g','מקדם אדיאבטי γ',1.2,1.67,.01,1.4],['v','נפח סופי (L)',1,20,.5,5]];controls.innerHTML=specs.map(([id,l,min,max,step,val])=>`<label>${l}: <b id="${id}o"></b><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${val}"></label>`).join('');function draw(){let [p,a,g,v]=specs.map(([id])=>{let n=+document.getElementById(id).value;document.getElementById(id+'o').textContent=n;return n});let f=(x,k)=>p*(a/x)**k, end=f(v,g), ymax=Math.max(4,Math.ceil(f(1,g)/5)*5), X=x=>65+x*35,Y=y=>355-y/ymax*320;let s='';for(let i=0;i<=5;i++){let y=ymax*i/5;s+=`<path d="M65 ${Y(y)} H765" stroke="#dce6ef"/><text x="55" y="${Y(y)+5}" text-anchor="end" font-size="15">${+y.toFixed(2)}</text>`}for(let x=0;x<=20;x+=2)s+=`<text x="${X(x)}" y="378" text-anchor="middle" font-size="15">${x}</text>`;s+=`<path d="M65 30 V355 H765" fill="none" stroke="#17324d" stroke-width="2"/><text x="12" y="20">P (bar)</text><text x="400" y="407" text-anchor="middle">V (L)</text>`;for(let [k,c,d] of [[g,'#e56824',''],[1,'#087dc4','7 5']]){let pts=Array.from({length:381},(_,i)=>{let x=1+i*.05;return X(x)+','+Y(f(x,k))}).join(' ');s+=`<polyline points="${pts}" fill="none" stroke="${c}" stroke-width="3" stroke-dasharray="${d}"/>`}s+=`<circle cx="${X(a)}" cy="${Y(p)}" r="6" fill="#17324d"/><circle cx="${X(v)}" cy="${Y(end)}" r="7" fill="#16a078"/>`;plot.innerHTML=s;result.textContent=`P₂ = ${p} × (${a} / ${v})^${g} = ${end.toFixed(2)} bar`;}controls.addEventListener('input',draw);draw();</script></html>
