<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>חוק הגזים המשולב</title><style>*{box-sizing:border-box}body{font:20px Arial;background:#edf4fa;color:#18334d;margin:0}main{max-width:1000px;margin:24px auto;background:white;padding:30px;border-radius:20px}h1{color:#075985;text-align:center}.formula{text-align:center;direction:ltr;font-size:30px;padding:18px;background:#e0f2fe;border-radius:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin:20px 0}label{display:block;font-weight:bold}input,select,button{font:inherit;padding:10px;border:1px solid #91a8bc;border-radius:8px;width:100%;margin-top:7px}input:disabled{background:#dcfce7;color:#14532d}button{background:#075985;color:white;cursor:pointer}#result{background:#e0f2fe;padding:20px;border-radius:12px;text-align:center;font-size:26px;overflow-wrap:anywhere}b{color:#075985}.math{direction:ltr;display:block;margin:12px}small{font-size:15px}</style><main><h1>מחשבון חוק הגזים המשולב</h1><div class="formula">P₁ · V₁ / T₁ = P₂ · V₂ / T₂</div><label>בחר משתנה לחישוב<select id="target"></select></label><div class="grid"><label>יחידות לחץ<select id="pu"><option>bar</option><option>kPa</option><option>Pa</option></select></label><label>יחידות נפח<select id="vu"><option>L</option><option>m³</option></select></label></div><div class="grid" id="fields"></div><div id="result" aria-live="polite"></div><p>הנחות: גז אידיאלי, מסה קבועה, לחצים מוחלטים וטמפרטורות בקלווין בלבד. שני הלחצים ושני הנפחים מוצגים באותן יחידות בהתאמה.</p><button id="reset">איפוס המחשבון</button></main><script>
const keys=['P1','V1','T1','P2','V2','T2'], names=['לחץ התחלתי','נפח התחלתי','טמפרטורה התחלתית','לחץ סופי','נפח סופי','טמפרטורה סופית'], defaults=[1,10,300,2,5,450], $=id=>document.getElementById(id), fmt=x=>Number(x.toPrecision(8)).toString();let prevP='bar',prevV='L';const factors={bar:100000,kPa:1000,Pa:1,L:.001,'m³':1};keys.forEach((k,i)=>{ $('target').add(new Option(names[i]+' ('+k+')',k));$('fields').insertAdjacentHTML('beforeend',`<label>${names[i]} (${k}) <span id="u${k}"></span><input id="${k}" type="number" step="any" min="0" value="${defaults[i]}"></label>`)});const terms={P1:[['P2','V2','T1'],['T2','V1']],V1:[['P2','V2','T1'],['T2','P1']],T1:[['P1','V1','T2'],['P2','V2']],P2:[['P1','V1','T2'],['T1','V2']],V2:[['P1','V1','T2'],['T1','P2']],T2:[['P2','V2','T1'],['P1','V1']]};function calc(){const t=$('target').value,unit=k=>k[0]==='P'?$('pu').value:k[0]==='V'?$('vu').value:'K';keys.forEach(k=>{$(k).disabled=k===t;$('u'+k).textContent=unit(k)});const a=Object.fromEntries(keys.map(k=>[k,Number($(k).value)]));if(keys.some(k=>k!==t&&(!Number.isFinite(a[k])||a[k]<=0))){$(t).value='';$('result').textContent='יש להזין חמישה ערכים חיוביים ותקינים';return}const [n,d]=terms[t],prod=l=>l.reduce((p,k)=>p*a[k],1),r=prod(n)/prod(d);if(!Number.isFinite(r)||r<=0){$('result').textContent='התוצאה מחוץ לטווח החישוב';return}$(t).value=fmt(r);$('result').innerHTML=`<b>1. נוסחה כללית</b><span class="math">${t} = (${n.join(' × ')}) / (${d.join(' × ')})</span><b>2. הצבת נתונים</b><span class="math">${t} = (${n.map(k=>fmt(a[k])).join(' × ')}) / (${d.map(k=>fmt(a[k])).join(' × ')})</span><b>3. תוצאה</b><span class="math">${t} = ${fmt(r)} ${unit(t)}</span>`}function convert(prefix,oldU,newU){keys.filter(k=>k[0]===prefix).forEach(k=>{if($(k).value!=='')$(k).value=fmt(Number($(k).value)*factors[oldU]/factors[newU])})}$('pu').onchange=()=>{convert('P',prevP,$('pu').value);prevP=$('pu').value;calc()};$('vu').onchange=()=>{convert('V',prevV,$('vu').value);prevV=$('vu').value;calc()};$('target').onchange=calc;keys.forEach(k=>$(k).oninput=calc);$('reset').onclick=()=>{$('target').value='P2';$('pu').value=prevP='bar';$('vu').value=prevV='L';keys.forEach((k,i)=>$(k).value=defaults[i]);calc()};$('reset').onclick();</script></html>
